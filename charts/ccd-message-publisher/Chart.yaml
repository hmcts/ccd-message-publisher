apiVersion: v2
description: A Helm chart for the HMCTS CCD Message Publisher
name: ccd-message-publisher
home: https://github.com/hmcts/ccd-message-publisher
version: 0.1.29
maintainers:
  - name: HMCTS CCD Dev Team
dependencies:
  - name: java
    version: 5.3.0
    repository: 'oci://hmctsprod.azurecr.io/helm'
  - name: servicebus
    version: 1.2.2
    repository: 'oci://hmctsprod.azurecr.io/helm'
    condition: servicebus.enabled
  # Keep ccd-core before other ccd-* dependencies until the shared pipeline's
  # deprecated-chart check uses an exact chart-name match.
  - name: ccd-core
    version: 9.3.0
    repository: 'oci://hmctsprod.azurecr.io/helm'
    condition: ccd-core.enabled
  - name: ccd-data-store-api
    version: 2.0.47
    repository: 'oci://hmctsprod.azurecr.io/helm'
    condition: ccd-data-store-api.enabled
